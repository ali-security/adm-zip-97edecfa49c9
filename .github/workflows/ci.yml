name: Linux build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha --grep pattern; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # mocha nolonger supports node 10
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 21.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          npm install

      - name: Run Tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha -R spec --grep "${{ inputs.test-filter }}"
          else
            npm test
          fi

      - name: Pack
        if: matrix.node-version == '20.x'
        run: npm pack

      - name: Upload package
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: adm-zip-tgz
          path: adm-zip-*.tgz
          if-no-files-found: error
